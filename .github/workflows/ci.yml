name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests
        run: node --test test/*.test.js
      - name: Build
        run: node scripts/build.js
      - name: index.html is up to date with src/
        run: git diff --exit-code index.html || (echo "index.html is out of date. Run node scripts/build.js and commit it." && exit 1)
